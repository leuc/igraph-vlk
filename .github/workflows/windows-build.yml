name: Windows Portable Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build-windows:
    runs-on: windows-latest
    
    # Run all steps inside the MSYS2 shell
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout igraph-vlk
      uses: actions/checkout@v4

    - name: Setup MSYS2 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        # Install the toolchain and dependencies required by CMakeLists.txt
        install: >-
          git
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-vulkan-devel
          mingw-w64-ucrt-x86_64-glfw
          mingw-w64-ucrt-x86_64-cglm
          mingw-w64-ucrt-x86_64-openxr
          mingw-w64-ucrt-x86_64-glslang
          mingw-w64-ucrt-x86_64-openmp

    - name: Build custom igraph (Static)
      run: |
        git clone https://github.com/leuc/igraph
        cd igraph
        git checkout testing
        # Build as a static library to embed it directly into the final .exe
        cmake -S . -B build -G Ninja \
          -DCMAKE_INSTALL_PREFIX=../local_install \
          -DIGRAPH_ENABLE_TLS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_C_FLAGS="-O3 -march=native" \
          -DCMAKE_CXX_FLAGS="-O3 -march=native"
        cmake --build build --target install

    - name: Configure and Build igraph-vlk
      run: |
        # Configure with release settings and point to the custom igraph install
        cmake -S . -B build -G Ninja \
          -Digraph_ROOT=$PWD/local_install/ \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Package Portable Binary and DLLs
      run: |
        mkdir -p portable_release/shaders
        
        # 1. Copy the executable
        cp build/igraph-vlk.exe portable_release/
        
        # 2. Copy the compiled SPIR-V shaders
        cp build/shaders/*.spv portable_release/shaders/
        
        # 3. Gather MinGW dependency DLLs to make it self-contained
        # This uses ldd to find all non-Windows-system DLLs (like libglfw3, libgomp, libgcc) 
        # and copies them next to the executable.
        ldd build/igraph-vlk.exe | grep "msys64" | awk '{print $3}' | xargs -I '{}' cp '{}' portable_release/ || true

    - name: Upload Portable Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: igraph-vlk-windows-portable
        path: portable_release/
