name: Windows Portable Build (Clang)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout igraph-vlk
      uses: actions/checkout@v4

    - name: Setup MSYS2 Clang64 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        # Switch to CLANG64 to support explicit OpenMP packaging
        msystem: CLANG64
        update: true
        # Use clang prefixes for all packages
        install: >-
          git
          mingw-w64-clang-x86_64-toolchain
          mingw-w64-clang-x86_64-cmake
          mingw-w64-clang-x86_64-ninja
          mingw-w64-clang-x86_64-vulkan-devel
          mingw-w64-clang-x86_64-glfw
          mingw-w64-clang-x86_64-cglm          
          mingw-w64-clang-x86_64-glslang

    - name: Build custom igraph (Static)
      run: |
        git clone https://github.com/leuc/igraph
        cd igraph
        git checkout testing
        echo "1.0.1-testing" > IGRAPH_VERSION
        # Build statically using Clang
        cmake -S . -B build -G Ninja \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_INSTALL_PREFIX=../local_install \
          -DIGRAPH_ENABLE_TLS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DIGRAPH_OPENMP_SUPPORT=OFF \
          -DCMAKE_C_FLAGS="-O3 -march=native" \
          -DCMAKE_CXX_FLAGS="-O3 -march=native"
        cmake --build build --target install

    - name: Configure and Build igraph-vlk
      run: |
        # Use Clang compilers for the main project
        cmake -S . -B build -G Ninja \
          -DUSE_OPENXR=OFF \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -Digraph_ROOT=$PWD/local_install/ \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Package Portable Binary and DLLs
      run: |
        mkdir -p portable_release/shaders
        
        # 1. Copy the executable
        cp build/igraph-vlk.exe portable_release/
        
        # 2. Copy the compiled SPIR-V shaders
        cp build/shaders/*.spv portable_release/shaders/
        
        # 3. Gather Clang64 dependency DLLs
        # Updated to grep for "clang64" instead of generic msys64
        # This will grab glfw, libc++, libomp (OpenMP), etc.
        ldd build/igraph-vlk.exe | grep -i "clang64" | awk '{print $3}' | xargs -I '{}' cp '{}' portable_release/ || true

    - name: Upload Portable Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: igraph-vlk-windows-portable
        path: portable_release/
