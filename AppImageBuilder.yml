version: 1
AppDir:
  path: ./build/AppDir
  app_info:
    id: igraph-vlk
    name: igraph-vlk
    icon: igraph-vlk
    version: 0.1.0
    exec: usr/bin/igraph-vlk
    exec_args: $@
  runtime:
    arch: [ x86_64 ]
    env:
      APPDIR_LIBRARY_PATH: $APPDIR/usr/lib
  files:
    exclude:
      - usr/share/man
      - usr/share/doc
AppImage:
  arch: x86_64
  update-information: None
  sign-key: None
